<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article ideas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Article ideas</h1>

        <div class="row mb-4">
            <div class="col text-center">
                <button id="fetchMarketRate" class="btn btn-primary">Market Rate (UAH to USD)</button>
                <p id="marketRate" class="mt-3"></p>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col text-center">
                <button id="fetchTechnicalGuide" class="btn btn-success">Technical guide on using Gemini</button>
                <div id="technicalGuide" class="mt-3">
                    <h3></h3>
                    <p></p>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col text-center">
                <button id="fetchFictionStory" class="btn btn-warning">Story about the future of planet Earth</button>
                <div id="fictionStory" class="mt-3">
                    <h3></h3>
                    <p></p>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col text-center">
                <button id="fetchRandomText" class="btn btn-info">Random Text</button>
                <div id="randomText" class="mt-3">
                    <h3></h3>
                    <p></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#fetchMarketRate").click(function () {
                const rateElement = $("#marketRate");
                rateElement.text("Loading...");

                $.ajax({
                    url: "http://localhost:8000/fetch-market",
                    method: "GET",
                    success: function (data) {
                        rateElement.text(`Market Rate (UAH to USD): ${data.rate}`);
                    },
                    error: function () {
                        rateElement.text("Error fetching market rate.");
                    }
                });
            });

            $("#fetchTechnicalGuide").click(function () {
                const guideElement = $("#technicalGuide");
                guideElement.find("h3").text("");
                guideElement.find("p").text("Loading...");

                $.ajax({
                    url: "http://localhost:8000/technical-guide",
                    method: "GET",
                    success: function (data) {
                        guideElement.find("h3").text("Technical Guide:");
                        guideElement.find("p").text(data.idea);
                    },
                    error: function () {
                        guideElement.find("p").text("Error fetching technical guide.");
                    }
                });
            });

            $("#fetchFictionStory").click(function () {
                const storyElement = $("#fictionStory");
                storyElement.find("h3").text("");
                storyElement.find("p").text("Loading...");

                $.ajax({
                    url: "http://localhost:8000/story-fiction",
                    method: "GET",
                    success: function (data) {
                        storyElement.find("h3").text("Fiction Story:");
                        storyElement.find("p").text(data.idea);
                    },
                    error: function () {
                        storyElement.find("p").text("Error fetching fiction story.");
                    }
                });
            });

            $("#fetchRandomText").click(function () {
                const randomTextElement = $("#randomText");
                randomTextElement.find("h3").text("");
                randomTextElement.find("p").text("Loading...");

                $.ajax({
                    url: "http://localhost:8000/article-idea",
                    method: "GET",
                    success: function (data) {
                        randomTextElement.find("h3").text("Random Text:");
                        randomTextElement.find("p").text(data.idea);
                    },
                    error: function () {
                        randomTextElement.find("p").text("Error fetching random text.");
                    }
                });
            });
        });
    </script>
</body>

</html>
